<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRIM. — cut your video, cleanly</title>
<meta name="description" content="A fast, self-hosted video trimmer. Upload, mark in and out points, cut." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<style>
  :root{
    --bg:#0B0D10;
    --surface:#14171B;
    --surface-2:#1B1F24;
    --hairline:#262B31;
    --text:#EDEEF0;
    --muted:#8B929B;
    --gold:#C9A46A;
    --gold-dim:#8C7248;
    --cyan:#4FD1C5;
    --danger:#E0685A;
    --radius:10px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,164,106,0.08), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 10%, rgba(79,209,197,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:rgba(201,164,106,0.35); }

  button, input{ font-family:inherit; }
  button{ cursor:pointer; }
  button:disabled{ cursor:not-allowed; opacity:0.45; }

  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  .app{
    max-width:920px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  header.masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:44px;
    flex-wrap:wrap;
    gap:12px;
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-size:28px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--text);
  }
  .wordmark .dot{ color:var(--gold); }
  .tagline{
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.03em;
  }

  .panel{
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    padding:28px;
  }

  /* ---------- Dropzone ---------- */
  .dropzone{
    border:1px dashed var(--hairline);
    border-radius:var(--radius);
    padding:64px 24px;
    text-align:center;
    transition:border-color 0.2s ease, background 0.2s ease;
    cursor:pointer;
  }
  .dropzone.drag-over{
    border-color:var(--gold);
    background:rgba(201,164,106,0.05);
  }
  .dropzone h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
    margin:0 0 8px;
  }
  .dropzone p{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  .dropzone .accent-line{
    width:36px; height:1px; background:var(--gold);
    margin:20px auto;
  }

  /* ---------- Stage ---------- */
  .stage video{
    width:100%;
    display:block;
    border-radius:6px;
    background:#000;
    max-height:460px;
  }
  .filename-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0 26px;
    font-size:13px;
    color:var(--muted);
  }
  .filename-row .name{ color:var(--text); font-weight:500; }
  .reset-link{
    background:none; border:none; color:var(--muted);
    font-size:13px; text-decoration:underline; text-underline-offset:3px;
    padding:0;
  }
  .reset-link:hover{ color:var(--text); }

  /* ---------- Filmstrip scrubber (signature element) ---------- */
  .scrubber-wrap{ margin-top:8px; }
  .timecodes{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .timecodes b{ color:var(--gold); font-weight:600; }
  .timecodes .sep{ color: var(--hairline); margin: 0 6px; }
  .timecodes .out-label b{ color: var(--cyan); }

  .filmstrip{
    position:relative;
    height:64px;
    border-radius:4px;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(255,255,255,0.02) 8px, rgba(255,255,255,0.02) 9px),
      var(--surface-2);
    border:1px solid var(--hairline);
    overflow:visible;
    user-select:none;
    touch-action:none;
  }
  .sprockets{
    position:absolute; left:0; right:0; height:8px;
    background-image: radial-gradient(circle, #000 2.2px, transparent 2.3px);
    background-size: 14px 8px;
    background-repeat: repeat-x;
    opacity:0.55;
  }
  .sprockets.top{ top:3px; }
  .sprockets.bottom{ bottom:3px; }

  .selection-band{
    position:absolute;
    top:0; bottom:0;
    background:linear-gradient(180deg, rgba(201,164,106,0.16), rgba(201,164,106,0.05));
    border-top:1px solid var(--gold);
    border-bottom:1px solid var(--gold);
  }
  .dimmed{
    position:absolute; top:0; bottom:0;
    background:rgba(0,0,0,0.55);
    pointer-events:none;
  }

  .handle{
    position:absolute;
    top:-2px; bottom:-2px;
    width:14px;
    margin-left:-7px;
    background:var(--gold);
    border-radius:3px;
    cursor:ew-resize;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .handle::after{
    content:'';
    width:2px; height:18px;
    background:rgba(0,0,0,0.5);
    border-radius:1px;
    box-shadow: 4px 0 0 rgba(0,0,0,0.5), -4px 0 0 rgba(0,0,0,0.5);
  }
  .handle:hover, .handle:active{ background:#DCB77E; }

  .playhead{
    position:absolute;
    top:-6px; bottom:-6px;
    width:2px;
    background:var(--cyan);
    pointer-events:none;
  }
  .playhead::before{
    content:'';
    position:absolute; top:-4px; left:50%;
    width:8px; height:8px;
    background:var(--cyan);
    border-radius:50%;
    transform:translateX(-50%);
  }

  /* ---------- Actions ---------- */
  .actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:32px;
    flex-wrap:wrap;
    gap:16px;
  }
  .duration-note{
    font-size:13px;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
  }
  .btn{
    border-radius:7px;
    border:1px solid transparent;
    padding:13px 26px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:var(--gold);
    color:#171308;
  }
  .btn-primary:hover:not(:disabled){ background:#DCB77E; }
  .btn-ghost{
    background:transparent;
    border-color:var(--hairline);
    color:var(--text);
  }
  .btn-ghost:hover:not(:disabled){ border-color:var(--gold); }

  .status-row{
    display:flex; align-items:center; gap:10px;
    font-size:13px; color:var(--muted);
  }
  .spinner{
    width:14px; height:14px;
    border-radius:50%;
    border:2px solid var(--hairline);
    border-top-color:var(--gold);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .error-banner{
    margin-top:18px;
    padding:12px 16px;
    border-radius:7px;
    border:1px solid rgba(224,104,90,0.4);
    background:rgba(224,104,90,0.08);
    color:#F0A79C;
    font-size:13px;
  }

  .result-panel{
    margin-top:28px;
    padding-top:28px;
    border-top:1px solid var(--hairline);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }
  .result-panel .label{
    font-family:'Fraunces', serif;
    font-size:18px;
  }
  .result-panel .label .dot{ color:var(--cyan); }

  footer{
    margin-top:56px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
  }
  footer a{ color:var(--muted); }

  @media (max-width:560px){
    .app{ padding:36px 16px 72px; }
    .panel{ padding:20px; }
    .dropzone{ padding:44px 16px; }
    .actions{ flex-direction:column; align-items:stretch; }
    .actions .btn{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .spinner{ animation:none; }
    .btn{ transition:none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useCallback, useEffect } = React;

const API = ""; // same-origin — backend serves this file too

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec - Math.floor(sec)) * 100);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}

function Dropzone({ onFile }) {
  const [dragOver, setDragOver] = useState(false);
  const inputRef = useRef(null);

  const handleDrop = useCallback((e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) onFile(file);
  }, [onFile]);

  return (
    <div
      className={`dropzone${dragOver ? ' drag-over' : ''}`}
      onClick={() => inputRef.current.click()}
      onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={handleDrop}
      role="button"
      tabIndex={0}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') inputRef.current.click(); }}
    >
      <h2>Drop a video, or click to choose one</h2>
      <div className="accent-line"></div>
      <p>MP4, MOV, WebM, MKV — up to 500MB. Nothing leaves this server.</p>
      <input
        ref={inputRef}
        type="file"
        accept="video/*"
        style={{ display: 'none' }}
        onChange={(e) => e.target.files[0] && onFile(e.target.files[0])}
      />
    </div>
  );
}

function Filmstrip({ duration, start, end, playhead, onChange, onSeek }) {
  const trackRef = useRef(null);
  const dragging = useRef(null); // 'start' | 'end' | 'seek' | null

  const pctToTime = useCallback((clientX) => {
    const rect = trackRef.current.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    return pct * duration;
  }, [duration]);

  const onPointerMove = useCallback((e) => {
    if (!dragging.current) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const t = pctToTime(clientX);
    if (dragging.current === 'start') {
      onChange(Math.min(t, end - 0.2), end);
    } else if (dragging.current === 'end') {
      onChange(start, Math.max(t, start + 0.2));
    } else if (dragging.current === 'seek') {
      onSeek(t);
    }
  }, [pctToTime, start, end, onChange, onSeek]);

  const stopDrag = useCallback(() => { dragging.current = null; }, []);

  useEffect(() => {
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('mouseup', stopDrag);
    window.addEventListener('touchend', stopDrag);
    return () => {
      window.removeEventListener('mousemove', onPointerMove);
      window.removeEventListener('touchmove', onPointerMove);
      window.removeEventListener('mouseup', stopDrag);
      window.removeEventListener('touchend', stopDrag);
    };
  }, [onPointerMove, stopDrag]);

  if (!duration) return null;
  const startPct = (start / duration) * 100;
  const endPct = (end / duration) * 100;
  const playPct = (Math.min(playhead, duration) / duration) * 100;

  return (
    <div className="scrubber-wrap">
      <div className="timecodes">
        <span className="in-label">IN &nbsp;<b>{formatTime(start)}</b></span>
        <span>selection <b style={{color:'var(--text)'}}>{formatTime(Math.max(0, end - start))}</b></span>
        <span className="out-label">OUT &nbsp;<b>{formatTime(end)}</b></span>
      </div>
      <div
        className="filmstrip"
        ref={trackRef}
        onMouseDown={(e) => {
          if (e.target.classList.contains('handle')) return;
          dragging.current = 'seek';
          onSeek(pctToTime(e.clientX));
        }}
        onTouchStart={(e) => {
          if (e.target.classList.contains('handle')) return;
          dragging.current = 'seek';
          onSeek(pctToTime(e.touches[0].clientX));
        }}
      >
        <div className="sprockets top"></div>
        <div className="sprockets bottom"></div>

        <div className="dimmed" style={{ left: 0, width: `${startPct}%` }}></div>
        <div className="dimmed" style={{ left: `${endPct}%`, right: 0 }}></div>
        <div className="selection-band" style={{ left: `${startPct}%`, width: `${endPct - startPct}%` }}></div>

        <div className="playhead" style={{ left: `${playPct}%` }}></div>

        <div
          className="handle"
          style={{ left: `${startPct}%` }}
          onMouseDown={(e) => { e.stopPropagation(); dragging.current = 'start'; }}
          onTouchStart={(e) => { e.stopPropagation(); dragging.current = 'start'; }}
          role="slider"
          aria-label="Trim start"
          aria-valuemin={0}
          aria-valuemax={duration}
          aria-valuenow={start}
          tabIndex={0}
          onKeyDown={(e) => {
            if (e.key === 'ArrowLeft') onChange(Math.max(0, start - 0.1), end);
            if (e.key === 'ArrowRight') onChange(Math.min(end - 0.2, start + 0.1), end);
          }}
        ></div>
        <div
          className="handle"
          style={{ left: `${endPct}%` }}
          onMouseDown={(e) => { e.stopPropagation(); dragging.current = 'end'; }}
          onTouchStart={(e) => { e.stopPropagation(); dragging.current = 'end'; }}
          role="slider"
          aria-label="Trim end"
          aria-valuemin={0}
          aria-valuemax={duration}
          aria-valuenow={end}
          tabIndex={0}
          onKeyDown={(e) => {
            if (e.key === 'ArrowLeft') onChange(start, Math.max(start + 0.2, end - 0.1));
            if (e.key === 'ArrowRight') onChange(start, Math.min(duration, end + 0.1));
          }}
        ></div>
      </div>
    </div>
  );
}

function App() {
  const [video, setVideo] = useState(null); // { video_id, filename, duration }
  const [start, setStart] = useState(0);
  const [end, setEnd] = useState(0);
  const [playhead, setPlayhead] = useState(0);
  const [uploading, setUploading] = useState(false);
  const [trimming, setTrimming] = useState(false);
  const [downloadUrl, setDownloadUrl] = useState(null);
  const [error, setError] = useState(null);
  const [objectUrl, setObjectUrl] = useState(null);
  const videoRef = useRef(null);

  const handleFile = useCallback(async (file) => {
    setError(null);
    setDownloadUrl(null);
    setUploading(true);
    setObjectUrl(URL.createObjectURL(file));

    const form = new FormData();
    form.append('file', file);

    try {
      const res = await fetch(`${API}/api/upload`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed.');
      setVideo(data);
      setStart(0);
      setEnd(data.duration);
    } catch (e) {
      setError(e.message);
      setVideo(null);
    } finally {
      setUploading(false);
    }
  }, []);

  const handleSeek = useCallback((t) => {
    setPlayhead(t);
    if (videoRef.current) videoRef.current.currentTime = t;
  }, []);

  const handleRangeChange = useCallback((s, e) => {
    setStart(s);
    setEnd(e);
  }, []);

  const onTimeUpdate = useCallback(() => {
    const v = videoRef.current;
    if (!v) return;
    setPlayhead(v.currentTime);
    if (v.currentTime >= end) {
      v.currentTime = start;
      if (!v.paused) v.play();
    }
  }, [start, end]);

  const doTrim = useCallback(async () => {
    if (!video) return;
    setTrimming(true);
    setError(null);
    setDownloadUrl(null);
    try {
      const res = await fetch(`${API}/api/trim`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ video_id: video.video_id, start, end }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Trim failed.');
      setDownloadUrl(`${API}${data.download_url}`);
    } catch (e) {
      setError(e.message);
    } finally {
      setTrimming(false);
    }
  }, [video, start, end]);

  const reset = useCallback(() => {
    setVideo(null);
    setObjectUrl(null);
    setDownloadUrl(null);
    setError(null);
    setStart(0);
    setEnd(0);
    setPlayhead(0);
  }, []);

  return (
    <div className="app">
      <header className="masthead">
        <div className="wordmark">TRIM<span className="dot">.</span></div>
        <div className="tagline">mark in, mark out, cut clean</div>
      </header>

      <div className="panel">
        {!video && !uploading && <Dropzone onFile={handleFile} />}

        {uploading && (
          <div className="dropzone">
            <h2>Reading your video…</h2>
            <div className="accent-line"></div>
            <p>Checking duration and format.</p>
          </div>
        )}

        {video && (
          <div className="stage">
            <video
              ref={videoRef}
              src={objectUrl}
              controls
              onTimeUpdate={onTimeUpdate}
              onLoadedMetadata={() => { if (videoRef.current) videoRef.current.currentTime = start; }}
            ></video>

            <div className="filename-row">
              <span>now editing — <span className="name">{video.filename}</span></span>
              <button className="reset-link" onClick={reset}>choose a different file</button>
            </div>

            <Filmstrip
              duration={video.duration}
              start={start}
              end={end}
              playhead={playhead}
              onChange={handleRangeChange}
              onSeek={handleSeek}
            />

            <div className="actions">
              <span className="duration-note">source length {formatTime(video.duration)}</span>
              <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                {trimming && (
                  <span className="status-row"><span className="spinner"></span> cutting…</span>
                )}
                <button className="btn btn-primary" onClick={doTrim} disabled={trimming || end - start < 0.1}>
                  Trim &amp; prepare download
                </button>
              </div>
            </div>

            {error && <div className="error-banner">{error}</div>}

            {downloadUrl && (
              <div className="result-panel">
                <div className="label">Cut is ready<span className="dot">.</span></div>
                <a className="btn btn-ghost" href={downloadUrl} download="trimmed.mp4">Download trimmed.mp4</a>
              </div>
            )}
          </div>
        )}
      </div>

      <footer>self-hosted &amp; open — your video is processed on your own server</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
